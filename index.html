<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emperor's Mind">
<meta name="theme-color" content="#08090b">
<title>Emperor's Mind</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{
  --bg:#0a0a0a; --bg2:#0e1014; --card:#111318; --card2:#161921; --line:#232733; --line2:#2e3342;
  --text:#ece7da; --mute:#8d8a80; --dim:#5d5b55;
  --gold:#cfa032; --gold2:#e6c066; --gold3:#8c6a1c; --goldbg:rgba(207,160,50,.10);
  --green:#3fbf7f; --red:#e0565b; --blue:#5aa6e0;
  --serif:'Cinzel','Cormorant Garamond',Georgia,serif; --serif2:'Cormorant Garamond',Georgia,serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --r:14px; --nav:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45}
body{min-height:100vh;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.02em;margin:0}
.serif{font-family:var(--serif2)}
.app{display:flex;min-height:100vh}
.side{display:none}
main{flex:1;min-width:0;max-width:1100px;margin:0 auto;padding:16px 16px 24px}
.topbar{display:flex;align-items:center;gap:10px;margin:2px 0 16px}
.topbar img{width:38px;height:auto}
.topbar .t{font-family:var(--serif);font-size:13px;letter-spacing:.28em;color:var(--gold)}
.topbar .sync{margin-left:auto;font-size:11px;color:var(--mute);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block}
.dot.on{background:var(--green)} .dot.warn{background:#d9a441}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
.pagehead h1{font-size:24px}
.eyebrow{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card.gold{border-color:rgba(207,160,50,.45);background:linear-gradient(180deg,#14130f,#101115)}
.card h2{font-size:15px;margin-bottom:10px}
.card h3{font-size:13px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))} .grid>*{min-width:0} input{min-width:0}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.mute{color:var(--mute)} .dim{color:var(--dim)} .small{font-size:12.5px} .tiny{font-size:11px}
.pos{color:var(--green)} .neg{color:var(--red)} .goldt{color:var(--gold)}
.btn{background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--gold3)}
.btn.pri{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1408;border:none;font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--red)}
.iconbtn{background:none;border:none;color:var(--mute);cursor:pointer;padding:6px;border-radius:8px;font-size:16px;line-height:1}
.iconbtn:hover{color:var(--gold);background:var(--card2)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],input[type=email],input[type=search],select,textarea{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--gold3)}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--mute);margin:10px 0 5px}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:none;padding:6px 11px;border-radius:7px;cursor:pointer;color:var(--mute);font-size:13px}
.seg button.on{background:var(--card2);color:var(--gold);box-shadow:0 0 0 1px var(--line2)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:none;color:var(--mute);padding:10px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
.tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:var(--card2);border:1px solid var(--line2);color:var(--mute)}
.pill.g{color:var(--gold);border-color:rgba(207,160,50,.4);background:var(--goldbg)}
.bar{height:6px;background:#1c1f27;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold3),var(--gold2));border-radius:99px}
.empty{color:var(--mute);text-align:center;padding:22px 10px;font-size:14px}
.stat .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.stat .v{font-family:var(--serif2);font-size:24px;font-weight:600;margin-top:2px}
.list>*+*{border-top:1px solid var(--line)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:rgba(8,9,11,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;z-index:20}
.nav button{flex:1;background:none;border:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--gold)}
@media(min-width:900px){
  body{padding-bottom:0}
  .nav{display:none}
  .side{display:flex;flex-direction:column;width:232px;flex-shrink:0;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;background:#0a0b0e}
  .side .brand{text-align:center;margin-bottom:18px}
  .side .brand img{width:96px}
  .side .brand .t{font-family:var(--serif);letter-spacing:.24em;font-size:12px;color:var(--gold);margin-top:6px}
  .side button{display:flex;align-items:center;gap:11px;background:none;border:none;color:var(--mute);padding:9px 12px;border-radius:10px;cursor:pointer;font-size:14px;text-align:left;width:100%}
  .side button svg{width:18px;height:18px}
  .side button:hover{color:var(--text);background:var(--card)}
  .side button.on{color:var(--gold);background:var(--goldbg)}
  .side .sec{font-size:10px;letter-spacing:.2em;color:var(--dim);margin:14px 12px 6px}
  main{padding:26px 30px}
  .topbar{display:none}
}
@media(max-width:640px){ .g2,.g3,.g4{grid-template-columns:1fr} .g4.keep,.g2.keep{grid-template-columns:repeat(2,minmax(0,1fr))} .g3.keep{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px} .g3.keep .card{padding:12px} .g3.keep .stat .v{font-size:19px} .g3.keep .stat .k{font-size:9.5px;letter-spacing:.08em} .pagehead h1{font-size:21px} }

/* home */
.hero{text-align:center;padding:22px 16px 18px;position:relative;overflow:hidden}
.hero .greet{font-family:var(--serif);font-size:22px;line-height:1.25}
.hero .greet b{color:var(--gold);font-weight:600}
.hero .date{color:var(--mute);font-size:13px;margin-top:4px;letter-spacing:.06em}
.piecewrap{width:150px;height:150px;margin:14px auto 6px;position:relative}
.piecewrap svg{width:100%;height:100%}
.piecewrap.glow::before{content:'';position:absolute;inset:10%;border-radius:50%;filter:blur(28px);opacity:.45;background:var(--glow,#cfa032)}
.rankname{font-family:var(--serif);font-size:18px;letter-spacing:.06em}
.streakline{display:flex;justify-content:center;gap:18px;margin-top:10px;font-size:14px;flex-wrap:wrap}
.streakline b{font-family:var(--serif2);font-size:20px}
.ring{width:84px;height:84px}
.mini-task{display:flex;align-items:center;gap:10px;padding:9px 0}

/* tasks */
.task{display:flex;align-items:flex-start;gap:12px;padding:11px 0}
.chk{width:30px;height:30px;flex-shrink:0;border-radius:8px;border:1.5px solid var(--gold3);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;margin-top:1px}
.chk.on{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:var(--gold);color:#1a1408}
.chk svg{width:16px;height:16px}
.task .body{flex:1;min-width:0;cursor:pointer}
.task .name{font-size:15.5px;font-weight:500}
.task.done .name{text-decoration:line-through;color:var(--mute)}
.task .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:3px}
.task .meta .rep{color:var(--green)}
.fire{color:#ff9d3a;font-weight:600}
.grouphead{display:flex;align-items:center;gap:10px;padding:2px 0 8px}
.grouphead h2{font-size:14px;margin:0;letter-spacing:.12em}
.addbar{position:sticky;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 8px);display:flex;gap:8px;margin-top:8px;z-index:5}
.addbar input{flex:1;border-color:var(--gold3);background:#0d0f13}
@media(min-width:900px){.addbar{bottom:14px}}
.days7{display:flex;gap:6px;flex-wrap:wrap}
.days7 button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--bg2);cursor:pointer;font-size:12.5px;color:var(--mute)}
.days7 button.on{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:600}

/* schedule */
.tl{position:relative;margin-left:52px;border-left:1px solid var(--line)}
.tl .hr{position:absolute;left:-52px;width:44px;text-align:right;font-size:11px;color:var(--dim);transform:translateY(-7px)}
.tl .hl{position:absolute;left:0;right:0;border-top:1px dashed #1b1e26}
.tl .ev{position:absolute;left:8px;right:4px;border-radius:9px;background:linear-gradient(180deg,rgba(207,160,50,.18),rgba(207,160,50,.08));border:1px solid rgba(207,160,50,.45);padding:5px 9px;font-size:13px;overflow:hidden;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.tl .ev.done{opacity:.5;text-decoration:line-through}
.tl .now{position:absolute;left:-4px;right:0;border-top:2px solid var(--red);z-index:3}
.tl .now::before{content:'';position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--red)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal{background:#0c0e12;border:1px solid var(--line2);border-radius:18px 18px 0 0;width:100%;max-width:620px;max-height:92vh;overflow-y:auto;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:18px;max-height:88vh}}
.modal .mh{display:flex;align-items:center;margin-bottom:6px}
.modal .mh h2{font-size:19px;flex:1}
.modal .actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.sw{width:46px;height:28px;border-radius:99px;background:#252935;position:relative;cursor:pointer;border:none;flex-shrink:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#7b7f8c;transition:.2s}
.sw.on{background:var(--gold)} .sw.on::after{left:21px;background:#fff}

/* celebrate */
.celebrate{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 40%,rgba(30,26,14,.97),rgba(0,0,0,.97));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:fadein .5s}
.celebrate .piecewrap{width:220px;height:220px;animation:rise 1s cubic-bezier(.2,.9,.3,1.2)}
@keyframes fadein{from{opacity:0}} @keyframes rise{from{transform:scale(.4) translateY(40px);opacity:0}}

/* trophy */
.trophies{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.trophy{text-align:center;padding:8px 2px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.trophy svg{width:100%;max-width:64px;height:auto;aspect-ratio:1}
.trophy .d{font-size:10.5px;color:var(--mute)}
.trophy.lock svg{opacity:.18;filter:grayscale(1)}
.trophy.cur{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:500;color:var(--mute);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 6px;border-bottom:1px solid #1a1d25;vertical-align:middle}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:#12141a}
.tbl .r{text-align:right}
.scrollx{overflow-x:auto}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr) 1.1fr;gap:5px}
.cal .h{font-size:10.5px;color:var(--mute);text-align:center;letter-spacing:.1em;padding-bottom:3px}
.cal .c{min-height:70px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);padding:5px 6px;font-size:11px;cursor:pointer;position:relative;display:flex;flex-direction:column}
.cal .c.out{opacity:.25;cursor:default}
.cal .c.win{background:rgba(63,191,127,.13);border-color:rgba(63,191,127,.45)}
.cal .c.loss{background:rgba(224,86,91,.13);border-color:rgba(224,86,91,.45)}
.cal .c .n{color:var(--mute)}
.cal .c .p{font-weight:600;font-size:12.5px;margin-top:auto}
.cal .c .note{position:absolute;top:4px;right:5px;font-size:10px}
.cal .wk{border-radius:10px;border:1px dashed var(--line2);padding:5px 6px;font-size:11px;display:flex;flex-direction:column;justify-content:center}
@media(max-width:640px){.cal{gap:3px}.cal .c{min-height:54px;padding:3px 4px}.cal .c .p{font-size:10.5px}.cal .c .t{display:none}}
.yeargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ym .mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ym .mg i{aspect-ratio:1;border-radius:3px;background:#161921}
.ym .mg i.w{background:var(--green)} .ym .mg i.l{background:var(--red)} .ym .mg i.x{background:transparent}

/* heatmap */
.heat{display:grid;grid-auto-flow:column;grid-auto-columns:13px;justify-content:start;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:3px;background:#15181f;display:block}
.heat i.l1{background:#3a2f15}.heat i.l2{background:#6a5019}.heat i.l3{background:#a37a22}.heat i.l4{background:#e6c066}
.heat i.f{visibility:hidden}

/* focus */
.timer{width:240px;height:240px;margin:6px auto;position:relative}
.timer .tt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer .tt .big{font-family:var(--serif2);font-size:52px;font-weight:600;letter-spacing:.02em}

/* bible */
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.bk{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;cursor:pointer;font-size:12.5px}
.bk .bar{height:4px;margin-top:5px}
.chap{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:5px}
.chap button{height:38px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);cursor:pointer;font-size:13px;color:var(--mute)}
.chap button.on{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:600}

.vision{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.vcard{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--card);cursor:pointer}
.vcard .img{height:120px;background:linear-gradient(135deg,#1a1710,#0e0f13);background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:10px}
.vcard .b{padding:12px 14px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);background:#1b1d24;border:1px solid var(--gold3);padding:10px 16px;border-radius:12px;z-index:90;font-size:14px;animation:fadein .2s}
.banner{background:rgba(217,164,65,.1);border:1px solid rgba(217,164,65,.4);color:#e6c27a;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:12px}
.verse{font-family:var(--serif2);font-size:19px;line-height:1.4;font-style:italic}
input[type=datetime-local],input[type=date],input[type=time]{font-size:14px;padding:10px 8px;-webkit-appearance:none;appearance:none;min-height:42px}
body.gated{padding-bottom:0}
.login{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 8px;max-width:380px;margin:0 auto}
.login img{width:190px;margin-bottom:18px}
.login h1{font-size:30px;margin:8px 0 6px}
.login-form{width:100%;display:flex;flex-direction:column;gap:12px;margin:18px 0 10px}
input[type=email],input[type=password]{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;outline:none;font-size:16px;text-align:center}
input[type=email]:focus,input[type=password]:focus{border-color:var(--gold3)}
body.gated .nav{display:none}
/* v2 home (screenshot style) */
.hhead{display:flex;align-items:center;gap:16px;margin:14px 2px 22px}
.hhead img{width:92px;flex-shrink:0}
.hdate{font-size:12px;letter-spacing:.2em;color:var(--gold);font-weight:600}
.hgreet{font-family:var(--serif2);font-size:32px;line-height:1.05;margin-top:6px;font-weight:500}
.hname{font-family:var(--serif);font-size:27px;color:var(--gold);letter-spacing:.02em;line-height:1.15;font-weight:600}
@media(min-width:900px){.hhead img{width:110px}.hgreet{font-size:40px}.hname{font-size:34px}}
.rankcard{display:flex;align-items:center;gap:18px;border-color:rgba(207,160,50,.35);background:#100f0c;cursor:pointer;padding:16px 20px}
.rankcard .rp{width:58px;height:58px;flex-shrink:0}
.rankcard .rp svg{width:100%;height:100%}
.rankcard .rn{font-family:var(--serif2);font-size:24px;font-weight:600;line-height:1.1}
.rankcard .rs{color:#b9b4a8;font-size:14.5px;margin-top:3px}
.tiles{gap:12px;margin-bottom:14px}
.tile{margin:0;padding:20px 18px;min-height:150px;background:#0f0f10}
.tile .tbig{font-family:var(--serif2);font-size:42px;font-weight:600;line-height:1}
.tile .tk{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:600;margin-top:16px}
.tile .tsub{color:#b9b4a8;font-size:14px;margin-top:5px;line-height:1.35}
.orders{padding:20px}
.ogh{display:flex;gap:12px;font-size:12px;letter-spacing:.22em;font-weight:600;color:var(--gold);padding:16px 0 8px;border-bottom:1px solid var(--line)}
/* war room */
.brief{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.brief b{font-family:var(--serif2);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.wk-cell{border:1px solid var(--line2);border-radius:9px;padding:7px 4px;text-align:center;cursor:pointer;background:var(--bg2);font-size:12px}
.wk-cell span{display:block;font-weight:600}.wk-cell i{font-style:normal;font-size:10.5px;color:var(--mute)}
.wk-cell.cur{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.wk-cell.done{background:var(--goldbg);border-color:var(--gold3)}.wk-cell.done span{color:var(--gold)}
.wk-cell.miss{border-color:rgba(224,86,91,.5)}
ol.code{text-align:left;max-width:520px;margin:14px auto;padding-left:22px;font-family:var(--serif2);font-size:19px;line-height:1.45}
ol.code li{margin:6px 0}
ol.code li::marker{color:var(--gold);font-family:var(--serif)}
body.gated .side{display:none}
body.gated main{max-width:none}
.login-form input[type=email],.login-form input[type=password]{border-radius:0;border:1px solid rgba(207,160,50,.45);background:#060606;text-align:left;padding:14px 16px}
.login-form input:focus{border-color:var(--gold)}
.login-form .btn.pri{border-radius:0;padding:15px;font-weight:500;letter-spacing:.35em;box-shadow:0 8px 28px rgba(207,160,50,.18)}
.login .btn.ghost{border-radius:0}
/* rituals, lock, insights, command */
body.ritual .side,body.ritual .nav{display:none}
body.ritual{padding-bottom:0}
.ritual-wrap{max-width:620px;margin:0 auto;min-height:88vh;display:flex;flex-direction:column;padding-top:8px}
.ritual-step{flex:1}
.rdots{display:flex;gap:6px}.rdots i{width:22px;height:4px;border-radius:2px;background:#26262a}.rdots i.past{background:var(--gold3)}.rdots i.on{background:var(--gold)}
.ritualcta{display:flex;align-items:center;gap:14px;width:100%;cursor:pointer;color:var(--text);border-color:rgba(207,160,50,.5);background:linear-gradient(90deg,rgba(207,160,50,.12),transparent)}
.mission{display:flex;flex-direction:column;gap:4px;border-color:rgba(207,160,50,.35)}.mission .tiny{color:var(--gold);letter-spacing:.18em;font-weight:600}.mission b{font-family:var(--serif2);font-size:20px}
.hhead{position:relative}.hcmd{position:absolute;right:-6px;top:-6px;color:var(--gold)}
.lockban{border-color:rgba(224,86,91,.55);background:linear-gradient(90deg,rgba(224,86,91,.12),transparent)}
.lockbtn{border-color:rgba(224,86,91,.5)}
.insight .ico{font-size:18px}.insight.dim{opacity:.6}
.cmdbtn{display:flex;align-items:center;gap:10px;margin-bottom:10px;border:1px solid var(--line2)!important;border-radius:10px;color:var(--mute)}
.cmdbtn kbd{margin-left:auto;font-size:10.5px;color:var(--dim);font-family:var(--sans)}
.topbar .iconbtn svg{width:20px;height:20px}
.hcmd svg,.cmdbtn svg{width:20px;height:20px}
#modal .row>span>svg{width:22px;height:22px}

[data-go]>span>svg{width:22px;height:22px}
main{padding-top:max(16px, env(safe-area-inset-top))}
.side{padding-top:max(22px, env(safe-area-inset-top))}
html,body{overscroll-behavior-y:none}
</style></head>

const COLS = ['tasks', 'days', 'goals', 'prayers', 'books', 'accounts', 'trades', 'tjournal', 'holdings', 'watch', 'reviews', 'misc', 'campaigns', 'enemies', 'aar', 'countdowns'];
const S = {}; COLS.forEach(c => S[c] = {});

function chain(key, fn) { const p = (writeChains[key] || Promise.resolve()).then(fn, fn); writeChains[key] = p.catch(() => { }); return p; }

  const body = JSON.parse(JSON.stringify({ ...data })); delete body.id;

}

  else localSave();
}
const all = col => Object.values(S[col]);
const misc = id => S.misc[id] || {};
async function initStore() {
  let db = null, user = null, id = null;
  try {
    if (window.claude && window.claude.use) {
      db = await window.claude.use('db');
      user = await window.claude.use('user');
      id = user ? await user.id() : null;
    }
  } catch (e) { console.warn(e); }
  if (db && id) {
    SYNC.mode = 'cloud';

    COLS.forEach(c => {
      BASE.collection(c).onSnapshot(snap => {
        const o = {}; snap.docs.forEach(d => { o[d.id] = { ...d.data(), id: d.id }; });
        S[c] = o;

}

/* ========== tasks & streak logic ========== */
function isDue(t, date) {
  if (t.kind === 'once') return false;

  const r = t.repeat || { type: 'daily' };
  if (r.type === 'daily') return true;
  if (r.type === 'weekdays') return (r.days || []).includes(dow(date));
  if (r.type === 'interval') return diffDays(start, date) % Math.max(1, r.every || 1) === 0;
  if (r.type === 'monthly') return parseD(date).getDate() === parseD(start).getDate();
  return true;
}

const isDoneOn = (t, date) => t.kind === 'once' ? !!t.done : !!dayDone(date)[t.id];
const activeDay = date => Object.values(dayDone(date)).some(Boolean);
function tasksForDate(date) {

  const once = all('tasks').filter(t => t.kind === 'once' && !t.archived && ((!t.done && (!t.date || t.date <= date)) || (t.done && t.doneAt === date)));

/* read an image file, downscale, return jpeg data URL */

    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); }; img.onerror = rej; img.src = fr.result; };

let celebrating = false;
function checkRankUp() {
  if (SYNC.loaded.size < COLS.length || celebrating) return;
  const { record } = streakInfo();
  const idx = pieceIndex(record);
  const prof = misc('profile');
  if (prof.bestStreak == null || record > (prof.bestStreak || 0) || (prof.seenPiece ?? -1) < idx) {
    const seen = prof.seenPiece ?? -1;
    put('misc', 'profile', { ...prof, bestStreak: Math.max(record, prof.bestStreak || 0), seenPiece: Math.max(idx, seen) });
    if (idx > seen && idx >= 0) {

      el.innerHTML = `<div class="eyebrow">New rank earned</div><div class="piecewrap glow" style="--glow:${m.glow}">${pieceSVG(idx)}</div>

}

const sum = a => a.reduce((s, x) => s + (x || 0), 0);

function pnlOf(t) {

}

    n: tr.length, net: sum(p), winRate: tr.length ? wins.length / tr.length : null, pf: gl ? gw / gl : (gw ? Infinity : null),
    exp: avg(p), avgWin: avg(wins.map(pnlOf)), avgLoss: avg(losses.map(pnlOf)), avgR: avg(rs), avgRR: avg(rr),
    hold: avg(h), holdW: avg(hw), holdL: avg(hl), best: p.length ? Math.max(...p) : null, worst: p.length ? Math.min(...p) : null,

}

function equitySVG(curve) {
  if (curve.length < 2) return '<div class="empty small">Log trades to see your equity curve.</div>';
  const W = 600, H = 180, P = 6, mn = Math.min(0, ...curve), mx = Math.max(0, ...curve), rg = mx - mn || 1;
  const x = i => P + i * (W - 2 * P) / (curve.length - 1), y = v => P + (mx - v) * (H - 2 * P) / rg;
  const pts = curve.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const last = curve[curve.length - 1], col = last >= 0 ? '#3fbf7f' : '#e0565b';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:200px;display:block" preserveAspectRatio="none"><defs><linearGradient id="eqg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
   <line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#2e3342" stroke-dasharray="4 4"/>
   <polygon points="${x(0)},${y(0)} ${pts} ${x(curve.length - 1)},${y(0)}" fill="url(#eqg)"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round"/></svg>`;
}
const statCard = (k, v, sub = '', c = '') => `<div class="card stat"><div class="k">${k}</div><div class="v ${c}">${v}</div>${sub ? `<div class="tiny mute">${sub}</div>` : ''}</div>`;
function breakdown(tr, by) {
  const g = {};
  const keyF = {
    setup: t => [t.setup || '(no setup)'], tag: t => (t.tags && t.tags.length ? t.tags : ['(no tag)']), mistake: t => (t.mistakes && t.mistakes.length ? t.mistakes : ['(no mistake)']),
    weekday: t => [['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][parseD(tradeDate(t)).getDay()]], hour: t => [t.openAt && t.openAt.length > 11 ? t.openAt.slice(11, 13) + ':00' : '(no time)'],
    side: t => [t.side === 'short' ? 'Short' : 'Long'], symbol: t => [(t.sym || '?').toUpperCase()], emotion: t => [t.emotion || '(none)'], account: t => [accName(t.acc)],
  }[by];
  tr.forEach(t => keyF(t).forEach(k => (g[k] = g[k] || []).push(t)));
  const rows = Object.entries(g).map(([k, a]) => ({ k, n: a.length, wr: a.filter(t => pnlOf(t) > 0).length / a.length, net: sum(a.map(pnlOf)), r: avg(a.map(rOf).filter(v => v != null)) }));
  const order = { weekday: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'] }[by];
  rows.sort((a, b) => order ? order.indexOf(a.k) - order.indexOf(b.k) : by === 'hour' ? a.k.localeCompare(b.k) : b.net - a.net);
  const mx = Math.max(1, ...rows.map(r => Math.abs(r.net)));
  return rows.length ? `<div class="scrollx"><table class="tbl"><tr><th>${by}</th><th class="r">Trades</th><th class="r">Win %</th><th class="r">Avg R</th><th class="r">Net P&L</th><th style="width:30%"></th></tr>
   ${rows.map(r => `<tr><td>${esc(r.k)}</td><td class="r">${r.n}</td><td class="r">${pct(r.wr, 0)}</td><td class="r">${r.r == null ? '–' : r.r.toFixed(2) + 'R'}</td><td class="r ${cls(r.net)}">${money(r.net, true)}</td>
   <td><div style="height:8px;border-radius:4px;width:${Math.abs(r.net) / mx * 100}%;background:${r.net >= 0 ? 'var(--green)' : 'var(--red)'};opacity:.75"></div></td></tr>`).join('')}</table></div>` : '<div class="empty small">No data yet.</div>';
}

  <div class="card"><div class="row wrap"><h2 style="margin:0">Breakdown</h2><span class="sp"></span><div class="seg">${['setup', 'tag', 'mistake', 'weekday', 'hour', 'side', 'symbol', 'emotion', 'account'].map(k => `<button class="${UI.breakBy === k ? 'on' : ''}" data-act="breakBy" data-k="${k}">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}</div></div>
  <div style="margin-top:12px">${breakdown(tr, UI.breakBy)}</div></div>`;

/* journal & rules */
function rulesAdherence(days) {
  const rules = tSettings().rules || []; if (!rules.length) return null;
  const t = today(); let ok = 0, tot = 0;
  for (let i = 0; i < days; i++) { const k = addDays(t, -i), j = S.tjournal[k]; if (!j || !j.rulesOk) continue; const traded = all('trades').some(x => tradeDate(x) === k); if (!traded && !Object.keys(j.rulesOk).length) continue; tot += rules.length; ok += rules.filter(r => j.rulesOk[r.id]).length; }
  return tot ? ok / tot : null;
}
function tJournal() {
  const k = UI.jDate || today(), j = S.tjournal[k] || {}, rules = tSettings().rules || [];
  const a = all('trades').filter(t => tradeDate(t) === k), v = sum(a.map(pnlOf));
  const okN = rules.filter(r => (j.rulesOk || {})[r.id]).length;
  return `<div class="row" style="margin-bottom:12px"><button class="iconbtn" data-act="jNav" data-d="-1">${ICON.left}</button><b class="serif" style="font-size:18px">${fmtDate(k, { weekday: 'short', day: 'numeric', month: 'long' })}</b><button class="iconbtn" data-act="jNav" data-d="1">${ICON.right}</button>${k !== today() ? '<button class="btn sm" data-act="jNav" data-d="0">Today</button>' : ''}<span class="sp"></span><span class="${cls(v)}"><b>${a.length ? money(v, true) : ''}</b></span></div>
  <div class="grid g2"><div class="card"><div class="row"><h2 style="margin:0">Trading rules</h2><span class="sp"></span>${rules.length ? `<span class="pill g">${okN}/${rules.length}</span>` : ''}<button class="btn sm ghost" data-act="editRules">Edit</button></div>
    <div class="list" style="margin-top:8px">${rules.map(r => { const on = (j.rulesOk || {})[r.id]; return `<div class="task" style="padding:8px 0"><button class="chk ${on ? 'on' : ''}" data-act="ruleTick" data-r="${r.id}" data-d="${k}">${ICON.check}</button><div class="body" style="padding-top:4px">${esc(r.text)}</div></div>`; }).join('') || '<div class="empty small">Add your rules, e.g. “Max 3 trades a day”, “No revenge trades”, “Risk max 1% per trade”.</div>'}</div>
    <div class="tiny mute" style="margin-top:8px">30-day adherence: <b class="goldt">${rulesAdherence(30) == null ? '–' : pct(rulesAdherence(30), 0)}</b></div></div>
   <div class="card"><h2>Trades this day</h2><div class="list">${a.map(t => `<div class="row" style="padding:8px 0;cursor:pointer" data-act="editTrade" data-id="${t.id}"><b>${esc(t.sym)}</b><span class="small mute">${esc(t.setup || '')}</span><span class="sp"></span><span class="${cls(pnlOf(t))}">${money(pnlOf(t), true)}</span></div>`).join('') || '<div class="empty small">No trades.</div>'}</div><button class="btn sm" data-act="newTrade" data-date="${k}" style="margin-top:8px">${ICON.plus} Trade</button></div></div>
  <div class="card"><h2>Pre-market plan</h2><textarea data-chg="jText" data-f="pre" data-d="${k}" placeholder="Bias, key levels, news, what you will and won't trade…">${esc(j.pre || '')}</textarea>
   <h2 style="margin-top:14px">Post-market recap</h2><textarea data-chg="jText" data-f="post" data-d="${k}" placeholder="What went well? What will you do better tomorrow?">${esc(j.post || '')}</textarea><div class="tiny mute" style="margin-top:6px">Saves automatically when you leave the field.</div></div>`;
}

/* ========== HEATMAP ========== */
function heatGrid(from, to, taskId) {
  const t = today(); let start = addDays(from, -((dow(from) + 6) % 7)); let cells = '', d = start, months = '', lastM = -1, col = 0;
  while (d <= to) {
    let lvl = 0, title = d;
    if (d < from || d > t) { cells += '<i class="f"></i>'; }
    else {
      if (taskId) { const tk = S.tasks[taskId]; const done = tk && isDoneOn(tk, d), due = tk && isDue(tk, d); lvl = done ? 4 : 0; title += done ? ' ✓' : due ? ' missed' : ''; }
      else { const r = dayRatio(d); lvl = r.done === 0 ? 0 : r.r < .34 ? 1 : r.r < .67 ? 2 : r.r < 1 ? 3 : 4; title += ` · ${r.done}/${r.due}`; }
      cells += `<i class="${lvl ? 'l' + lvl : ''}" title="${title}"></i>`;
    }
    if (dow(d) === 1) { const m = parseD(d).getMonth(); if (m !== lastM && d >= addDays(from, -6)) { months += `<span style="position:absolute;left:${col * 16}px">${MONTHS[m].slice(0, 3)}</span>`; lastM = m; } col++; }
    d = addDays(d, 1);
  }
  return `<div style="overflow-x:auto"><div style="position:relative;height:16px;font-size:10px;color:var(--dim);min-width:${col * 16}px">${months}</div><div class="heat">${cells}</div></div>
   <div class="row tiny mute" style="margin-top:8px;gap:4px">Less <span class="heat" style="display:inline-flex;grid-auto-flow:unset;gap:3px"><i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i></span> More</div>`;
}
UI.heatYear = null; UI.heatTask = '';
VIEWS.heatmap = () => {
  const y = UI.heatYear || +today().slice(0, 4);
  const from = y + '-01-01', to = y + '-12-31', t = today();
  let full = 0, active = 0, ratios = [];
  for (let d = from; d <= to && d <= t; d = addDays(d, 1)) { const r = dayRatio(d); if (r.due) ratios.push(r.r); if (r.done) active++; if (r.due && r.r >= 1) full++; }
  const tasks = all('tasks').filter(x => x.kind !== 'once');
  return `<div class="pagehead"><div><div class="eyebrow">Habit Heatmap</div><h1>${y}</h1></div><div class="row"><button class="iconbtn" data-act="heatY" data-d="-1">${ICON.left}</button><button class="iconbtn" data-act="heatY" data-d="1">${ICON.right}</button></div></div>
  <div class="grid g3 keep">${statCard('Perfect days', full, 'every task done')}${statCard('Active days', active, 'at least one task')}${statCard('Avg completion', ratios.length ? pct(avg(ratios), 0) : '–')}</div>
  <div class="card"><div class="row wrap"><h2 style="margin:0">Daily completion</h2><span class="sp"></span><select data-chg="heatTask" style="width:auto;padding:7px 10px;font-size:14px"><option value="">All tasks</option>${tasks.map(x => `<option value="${x.id}" ${UI.heatTask === x.id ? 'selected' : ''}>${esc(x.title)}</option>`).join('')}</select></div>
  <div style="margin-top:14px">${heatGrid(from, to, UI.heatTask)}</div></div>
  <div class="card"><h2>Task streaks</h2><div class="list">${tasks.filter(x => !x.archived).map(x => `<div class="row" style="padding:9px 0"><span style="flex:1">${esc(x.title)}</span><span class="small mute">${repeatLabel(x)}</span><span class="fire" style="min-width:56px;text-align:right">${taskStreak(x)} 🔥</span></div>`).join('') || '<div class="empty small">No repeating tasks yet.</div>'}</div></div>`;
};

/* ========== FOCUS TIMER ========== */
const FKEY = 'em-focus';
const F = (() => { try { return JSON.parse(localStorage.getItem(FKEY) || 'null') || {}; } catch (e) { return {}; } })();
F.dur = F.dur || 50; F.label = F.label || '';
const fSave = () => { try { localStorage.setItem(FKEY, JSON.stringify(F)); } catch (e) { } };
/* tell the server when the session ends, so it can send the alarm even if the app is closed */
const fSync = () => { try { const cur = misc('focus'); const endAt = F.endAt || null; if ((cur.endAt || null) !== endAt) put('misc', 'focus', { endAt, label: F.label || 'Deep work', dur: F.dur }); } catch (e) { } };
function fRemaining() { if (F.endAt) return Math.max(0, F.endAt - Date.now()); if (F.left != null) return F.left; return F.dur * 6e4; }
let audioCtx = null;
function beep() { try { if (!audioCtx) return; [0, .35, .7].forEach(t => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(.0001, audioCtx.currentTime + t); g.gain.exponentialRampToValueAtTime(.3, audioCtx.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + t + .3); o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + .32); }); } catch (e) { } }
function fFinish() {
  const mins = F.dur, d = today(), day = S.days[d] || { done: {} };
  put('days', d, { ...day, focus: (day.focus || 0) + mins, sessions: [...(day.sessions || []), { label: F.label || 'Deep work', min: mins, at: hhmm() }] });
  F.endAt = null; F.left = null; fSave(); fSync(); beep(); toast('Focus session complete — ' + mins + ' min logged 👑'); if (UI.view === 'focus') render();
}
setInterval(() => {
  if (F.endAt && Date.now() >= F.endAt) { if (SYNC.loaded.size === COLS.length) fFinish(); return; }
  const el = $('#ftime'); if (el) { const r = fRemaining(); el.textContent = pad(Math.floor(r / 6e4)) + ':' + pad(Math.floor(r / 1000) % 60); const ring = $('#fring'); if (ring) ring.setAttribute('stroke-dashoffset', ring.dataset.c * (r / (F.dur * 6e4))); }
}, 500);
VIEWS.focus = () => {
  if (typeof pushRefresh === 'function') setTimeout(pushRefresh, 0);
  const r = fRemaining(), running = !!F.endAt, paused = !F.endAt && F.left != null, C = 2 * Math.PI * 108;
  const d = today(), td = S.days[d] || {};
  let week = 0, bars = ''; const last7 = [];
  for (let i = 6; i >= 0; i--) { const k = addDays(d, -i), m = (S.days[k] && S.days[k].focus) || 0; last7.push([k, m]); if (k >= weekStart(d)) week += m; }
  const mx = Math.max(60, ...last7.map(x => x[1]));
  bars = last7.map(([k, m]) => `<div style="flex:1;text-align:center"><div style="height:90px;display:flex;align-items:flex-end;justify-content:center"><div style="width:60%;height:${m / mx * 100}%;min-height:2px;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--gold2),var(--gold3))"></div></div><div class="tiny mute" style="margin-top:4px">${DOW[dow(k)]}</div><div class="tiny">${m ? minsToHM(m) : ''}</div></div>`).join('');
  return `<div class="pagehead"><div><div class="eyebrow">Focus Timer</div><h1>Deep Work</h1></div></div>

    <div class="timer"><svg viewBox="0 0 240 240" style="width:100%;height:100%"><circle cx="120" cy="120" r="108" fill="none" stroke="#1c1f27" stroke-width="9"/><circle id="fring" data-c="${C}" cx="120" cy="120" r="108" fill="none" stroke="url(#rg2)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (r / (F.dur * 6e4))}" transform="rotate(-90 120 120)"/><defs><linearGradient id="rg2"><stop offset="0" stop-color="#8c6a1c"/><stop offset="1" stop-color="#e6c066"/></linearGradient></defs></svg>
     <div class="tt"><div class="big" id="ftime">${pad(Math.floor(r / 6e4))}:${pad(Math.floor(r / 1000) % 60)}</div><div class="tiny mute">${running ? 'Stay locked in' : paused ? 'Paused' : F.dur + ' min session'}</div></div></div>
    ${!running && !paused ? `<div class="seg" style="margin-bottom:12px">${[25, 50, 90].map(m => `<button class="${F.dur === m ? 'on' : ''}" data-act="fDur" data-m="${m}">${m} min</button>`).join('')}<button class="${![25, 50, 90].includes(F.dur) ? 'on' : ''}" data-act="fCustom">Custom</button></div>` : ''}

};

/* ========== period stats (weekly review + monthly report) ========== */
function periodStats(from, to) {
  const end = to < today() ? to : today();
  let due = 0, done = 0, active = 0, perfect = 0, focus = 0, best = null;
  for (let d = from; d <= end; d = addDays(d, 1)) { const r = dayRatio(d); due += r.due; done += r.done; if (r.done) active++; if (r.due && r.r >= 1) perfect++; focus += (S.days[d] && S.days[d].focus) || 0; if (r.due && (!best || r.r > best.r)) best = { d, r: r.r }; }
  const tr = all('trades').filter(t => tradeDate(t) >= from && tradeDate(t) <= to), st = computeStats(tr);
  const missed = all('tasks').filter(t => t.kind !== 'once').map(t => { let dd = 0, dn = 0; for (let d = from; d <= end; d = addDays(d, 1)) { if (!isDue(t, d)) continue; const ok = isDoneOn(t, d); if (!ok && (d === today() || isRestDay(d))) continue; dd++; if (ok) dn++; } return { t, dd, dn, miss: dd - dn }; }).filter(x => x.miss > 0).sort((a, b) => b.miss - a.miss || a.dn / a.dd - b.dn / b.dd);
  return { due, done, rate: due ? done / due : null, active, perfect, focus, best, trades: tr.length, pnl: tr.length ? st.net : 0, winRate: st.winRate, missed };
}
/* best streak reached up to a given date (rest days respected) */
function recordUpTo(date) {
  const dates = Object.keys(S.days).filter(activeDay).sort(); let best = 0, run = 0;
  if (dates.length) for (let x = dates[0], g = 0; x <= date && g < 6000; x = addDays(x, 1), g++) { if (activeDay(x)) { run++; best = Math.max(best, run); } else if (!isRestDay(x)) run = 0; }
  return best;
}
const deltaTxt = (cur, prev, kind) => {
  if (cur == null || prev == null) return '';
  const d = cur - prev; if (Math.abs(d) < (kind === 'pct' ? .005 : .5)) return '<span class="mute">= vs last</span>';
  const up = d > 0, v = kind === 'pct' ? Math.round(Math.abs(d) * 100) + ' pts' : kind === 'min' ? minsToHM(Math.abs(d)) : kind === 'money' ? money(Math.abs(d)) : Math.abs(Math.round(d));
  return `<span class="${up ? 'pos' : 'neg'}">${up ? '▲' : '▼'} ${v}</span> <span class="mute">vs last</span>`;
};
function periodSummary(c, p, label) {
  const out = [];
  if (c.rate != null) out.push(`You completed <b>${pct(c.rate, 0)}</b> of your tasks${p.rate != null ? ` — ${c.rate > p.rate + .005 ? 'up' : c.rate < p.rate - .005 ? 'down' : 'level'} from ${pct(p.rate, 0)} last ${label}` : ''}.`);
  out.push(`<b>${c.active}</b> active day${c.active === 1 ? '' : 's'}${c.perfect ? `, <b>${c.perfect}</b> perfect` : ''}${c.best ? `; strongest day was ${fmtDate(c.best.d, { weekday: 'long', day: 'numeric', month: 'short' })} (${Math.round(c.best.r * 100)}%)` : ''}.`);
  if (c.focus || p.focus) out.push(`Deep work: <b>${minsToHM(c.focus)}</b>${p.focus ? ` (${c.focus >= p.focus ? '+' : '−'}${minsToHM(Math.abs(c.focus - p.focus))} vs last ${label})` : ''}.`);
  if (c.trades) out.push(`Trading: <b class="${cls(c.pnl)}">${money(c.pnl, true)}</b> over ${c.trades} trade${c.trades === 1 ? '' : 's'}, win rate ${pct(c.winRate, 0)}${p.trades ? ` (last ${label}: ${money(p.pnl, true)})` : ''}.`);
  if (c.missed.length) out.push(`Most missed: ${c.missed.slice(0, 3).map(x => `<b>${esc(x.t.title)}</b> (${x.dn}/${x.dd})`).join(', ')}.`);
  else if (c.due) out.push('No repeating task was missed. Flawless.');
  return out.map(x => `<p style="margin:0 0 6px">${x}</p>`).join('');
}

const campWeeks = c => Math.max(1, Math.ceil((diffDays(c.start, c.end) + 1) / 7));

function enemyStats(e) {
  const rel = (e.relapses || []).map(r => r.date).sort();
  const pts = [e.start || today(), ...rel];
  let best = 0; for (let i = 1; i < pts.length; i++) best = Math.max(best, diffDays(pts[i - 1], pts[i]));
  const cur = Math.max(0, diffDays(rel.length ? rel[rel.length - 1] : (e.start || today()), today()));
  return { cur, best: Math.max(best, cur), n: rel.length };
}

function insightData(days = 120) {

  if (!email) { msg.className = 'small neg'; msg.textContent = 'Type your email first.'; return; }

  msg.className = error ? 'small neg' : 'small goldt'; msg.textContent = error ? error.message : 'Password reset email sent.';
};
/* password recovery link lands here */
SB.auth.onAuthStateChange((ev) => {
  if (ev === 'PASSWORD_RECOVERY') setTimeout(() => openModal(mh('Set a new password') + '<input type="password" id="np" placeholder="New password" minlength="6"><div class="actions"><button class="btn pri" id="np-s">Save</button></div>', m => m.querySelector('#np-s').onclick = async () => { const { error } = await SB.auth.updateUser({ password: m.querySelector('#np').value }); toast(error ? error.message : 'Password updated'); if (!error) closeModal(); }), 300);
});

function accountCard() {
  setTimeout(pushRefresh, 0);
  return `<div class="card gold"><div class="row"><div><div class="eyebrow">Account</div><div style="margin-top:4px">${esc(SESSION ? SESSION.user.email : '')}</div><div class="tiny mute" style="margin-top:2px">${syncLabel()}</div></div><span class="sp"></span><button class="btn sm" data-act="signOut">Sign out</button></div></div>
  <div class="card"><h2>Install on your devices</h2><div class="small mute"><b style="color:var(--text)">iPhone:</b> open this page in Safari → Share → <i>Add to Home Screen</i>.<br><b style="color:var(--text)">Mac:</b> Safari → File → <i>Add to Dock</i> (or Chrome → ⋮ → <i>Cast, save and share → Install page as app</i>).<br>Sign in once on each device — everything syncs automatically.</div></div>` + securityCard() + timeZoneCard() + notifyCard();
}
ACT.signOut = () => confirmBox('Sign out on this device?', async () => { await SB.auth.signOut(); }, 'Sign out');

async function bulkImport(data) {
  if (!SESSION) throw new Error('Not signed in');
  const rows = []; COLS.forEach(c => Object.entries(data[c] || {}).forEach(([id, body]) => { const b = { ...body }; delete b.id; rows.push({ user_id: SESSION.user.id, col: c, id, data: b, updated_at: new Date().toISOString() }); }));
  for (let i = 0; i < rows.length; i += 300) { const { error } = await SB.from('docs').upsert(rows.slice(i, i + 300)); if (error) throw error; }
  await loadAll(); return rows.length;
}

/* ========== Face ID / Touch ID lock (WebAuthn, on this device) ========== */
const LOCK_KEY = 'em-lock';
function lockCfg() { try { return JSON.parse(localStorage.getItem(LOCK_KEY) || 'null'); } catch (e) { return null; } }
let LOCKED = !!lockCfg(), hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (lockCfg() && hiddenAt && Date.now() - hiddenAt > 120000) { LOCKED = true; render(true); }
});
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
const bioName = () => /Mac/.test(navigator.platform) && !('ontouchend' in document) ? 'Touch ID' : 'Face ID';
function lockScreen() {
  document.body.classList.add('gated'); $('#side').innerHTML = ''; $('#nav').innerHTML = '';
  $('#main').innerHTML = `<div class="login"><img src="${EAGLE}" alt=""><div class="eyebrow" style="letter-spacing:.35em">Locked</div><h1>Emperor's Mind</h1>
    <p class="mute small">Welcome back, Emperor Blanco.</p>
    <div class="login-form"><button class="btn pri" data-act="unlock" style="width:100%">UNLOCK WITH ${bioName().toUpperCase()}</button><div class="small" id="lockmsg" style="min-height:20px"></div></div>
    <button class="btn ghost sm" data-act="lockPw">Use email and password instead</button></div>`;
  return true;
}
ACT.unlock = async () => {
  const cfg = lockCfg(), msg = $('#lockmsg'); if (!cfg) { LOCKED = false; render(true); return; }
  try {
    const cred = await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: 'public-key', id: unb64u(cfg.id) }], userVerification: 'required', timeout: 60000, rpId: location.hostname } });
    if (cred) { LOCKED = false; render(true); }
  } catch (e) { if (msg) { msg.className = 'small neg'; msg.textContent = 'Not unlocked. Try again.'; } }
};
ACT.lockPw = () => confirmBox('Sign out and sign in with your email and password?', async () => { LOCKED = false; await SB.auth.signOut(); }, 'Sign out');
function securityCard() {
  const on = !!lockCfg();
  return `<div class="card"><div class="row"><div style="flex:1"><h2 style="margin:0">${bioName()} lock</h2><div class="small mute" style="margin-top:4px">Ask for ${bioName()} every time you open the app on this device. You stay signed in — no typing.</div></div><button class="sw ${on ? 'on' : ''}" data-act="lockToggle" aria-label="Toggle ${bioName()} lock"></button></div></div>`;
}
ACT.lockToggle = async () => {
  if (lockCfg()) { localStorage.removeItem(LOCK_KEY); toast(bioName() + ' lock off'); render(true); return; }
  try {
    if (!window.PublicKeyCredential || !(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())) { toast(bioName() + ' is not available here'); return; }
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: "Emperor's Mind", id: location.hostname },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: (SESSION && SESSION.user.email) || 'emperor', displayName: 'Emperor Blanco' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' }, timeout: 60000, attestation: 'none' } });
    localStorage.setItem(LOCK_KEY, JSON.stringify({ id: b64u(cred.rawId) })); toast(bioName() + ' lock on 👑'); render(true);
  } catch (e) { console.warn(e); toast('Could not set up ' + bioName()); }
};

/* ========== Push notifications ========== */
UI.push = 'checking';
async function pushRefresh() {
  let st = 'unsupported';
  try {
    if ('serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window) {
      if (Notification.permission === 'denied') st = 'denied';
      else { const reg = await navigator.serviceWorker.ready; st = (await reg.pushManager.getSubscription()) ? 'on' : 'off'; }
    }
  } catch (e) { }
  if (st !== UI.push) { UI.push = st; if (UI.view === 'settings' || UI.view === 'focus') scheduleRender(); }
}
const notifyCfg = () => ({ morning: '07:00', streak: '21:00', aar: '21:30', weekly: true, weeklyTime: '18:00', monthly: true, ...misc('notify') });
function notifyCard() {
  const c = notifyCfg(), ios = /iPhone|iPad|iPod/.test(navigator.userAgent), standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const status = UI.push === 'on' ? '<span class="dot on"></span> On for this device' : UI.push === 'denied' ? '<span class="dot" style="background:var(--red)"></span> Blocked — allow notifications for this app in your device settings' : UI.push === 'unsupported' ? (ios && !standalone ? 'Add the app to your Home Screen first, then open it from there.' : 'Not supported in this browser.') : UI.push === 'checking' ? 'Checking…' : 'Off on this device';
  const tm = (k, l) => `<div class="row" style="padding:7px 0"><span style="flex:1">${l}</span><input type="time" value="${esc(c[k] || '')}" data-chg="notifyTime" data-k="${k}" style="width:120px"><button class="iconbtn" data-act="notifyClear" data-k="${k}" title="Turn off">${ICON.x}</button></div>`;
  return `<div class="card"><div class="row"><div style="flex:1"><h2 style="margin:0">Notifications</h2><div class="small mute" style="margin-top:4px">${status}</div></div>
   ${UI.push === 'on' ? '<button class="btn sm" data-act="pushTest">Send test</button><button class="btn sm ghost" data-act="pushOff">Turn off</button>' : UI.push === 'off' ? '<button class="btn sm pri" data-act="pushOn">Turn on</button>' : ''}</div>
   <div class="list" style="margin-top:10px">${tm('morning', '☀️ Morning briefing')}${tm('streak', '🔥 Streak in danger (only if nothing done)')}${tm('aar', '📝 After Action Report (only if not filed)')}
    <div class="row" style="padding:7px 0"><span style="flex:1">📊 Weekly review — Sundays</span><input type="time" value="${esc(c.weekly ? c.weeklyTime : '')}" data-chg="notifyTime" data-k="weeklyTime" style="width:120px"><button class="sw ${c.weekly ? 'on' : ''}" data-act="notifyFlag" data-k="weekly"></button></div>
    <div class="row" style="padding:7px 0"><span style="flex:1">🗓 Monthly report — 1st of the month, 09:00</span><button class="sw ${c.monthly ? 'on' : ''}" data-act="notifyFlag" data-k="monthly"></button></div></div>
   <div class="tiny mute" style="margin-top:6px">Times are ${esc(tzCity(appTz()))} time (change it under Time zone). Turn notifications on separately on each device.</div></div>`;
}
ACT.notifyTime = (d, el) => { const c = notifyCfg(); if (d.k === 'weeklyTime') c.weekly = !!el.value; put('misc', 'notify', { ...c, [d.k]: el.value }); };
ACT.notifyClear = d => put('misc', 'notify', { ...notifyCfg(), [d.k]: '' });
ACT.notifyFlag = d => { const c = notifyCfg(); put('misc', 'notify', { ...c, [d.k]: !c[d.k] }); };
ACT.pushOn = async () => {
  try {
    const perm = await Notification.requestPermission(); if (perm !== 'granted') { toast('Notifications not allowed'); pushRefresh(); return; }
    const { key } = await fnCall({ action: 'vapid' });
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: unb64u(key) });
    const j = sub.toJSON();
    const { error } = await SB.from('push_subs').upsert({ endpoint: j.endpoint, user_id: SESSION.user.id, sub: j });
    if (error) throw error;
    if (!S.misc.notify) put('misc', 'notify', notifyCfg());
    toast('Notifications on 👑'); await pushRefresh(); render(true);
  } catch (e) { console.warn(e); toast('Could not turn on notifications'); }
};
ACT.pushOff = async () => {
  try { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); if (sub) { await SB.from('push_subs').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); } } catch (e) { }
  await pushRefresh(); render(true);
};
ACT.pushTest = async () => {
  try { const r = await fetch(FN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + SESSION.access_token }, body: JSON.stringify({ action: 'test' }) }); const j = await r.json(); toast(j.sent ? 'Test sent — check your notifications' : 'No device subscribed yet'); }
  catch (e) { toast('Test failed'); }
};

/* ========== boot ========== */
(function boot() {
  const h = (location.hash || '').slice(1);
  if (h && (VIEWS[h])) UI.view = h;
  window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== UI.view) { UI.view = v; render(); } });
  render();
  initStore();
  let lastDay = today();
  setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
})();

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script></body></html>
